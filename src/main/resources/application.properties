spring.application.name=foot-fanatics

# Provedor externo de dados esportivos (Aula 08). A URL e o token vêm só do ambiente; nada real fica no Git.
# Os limites abaixo são valores de partida (hipótese, a validar com o provedor).
sports.provider.base-url=${SPORTS_PROVIDER_URL}
sports.provider.token=${SPORTS_PROVIDER_TOKEN}
sports.provider.connect-timeout=500ms
sports.provider.read-timeout=1500ms
sports.provider.max-response-bytes=65536
